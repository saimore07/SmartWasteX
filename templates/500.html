{% extends "base.html" %}

{% block title %}Server Error — SmartWasteX{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6 py-5">
            <div class="display-1 fw-bold text-danger mb-3 brand-font">500</div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
